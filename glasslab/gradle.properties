org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 defaults to its new DSL, which refuses the standalone Kotlin plugin.
# Turn the new DSL off so the Kotlin plugin (and the Compose compiler plugin) apply
# normally; this module is a plain Android app, not a Flutter module.
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
