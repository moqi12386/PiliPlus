name: GlassLab

on:
    workflow_dispatch:

jobs:
    apk:
        name: Build GlassLab APK
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up JDK
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: "8.11.1"
                  cache-dependency-path: |
                      glasslab/*.gradle*
                      glasslab/app/build.gradle*

            - name: Build debug APK
              run: gradle -p glasslab assembleDebug --no-daemon --stacktrace

            - name: Upload APK
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: GlassLab
                  path: glasslab/app/build/outputs/apk/debug/app-debug.apk
